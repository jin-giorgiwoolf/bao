.arrow{color:#bfbfc2;font-size:5.3cqw;line-height:.65;vertical-align:-.22cqw;margin-left:2.15cqw}
#detail{padding:0 4.65cqw}
.hero{padding:3.6cqw 0 8.5cqw}
.hero h1{font-size:14.5cqw;letter-spacing:-.55cqw;line-height:1.15;margin-bottom:1.05cqw}
.hero .sub{font-size:4cqw;margin-top:1.1cqw}
.box{border-radius:5.5cqw;padding:3.45cqw 4.65cqw;margin-bottom:3.65cqw;font-size:4cqw}
.box .sub{font-size:4cqw;margin-top:1.1cqw}
.total{margin-top:3.45cqw;padding-top:2.8cqw}
.note{font-size:2.9cqw;color:#838386;margin:-1.7cqw 4.65cqw 5.5cqw;line-height:1.35}
.section-title{padding-block:4cqw;color:#2782cc}
</style>
<main>
<header><button id="back" class="pill" aria-label="返回交易列表" hidden>‹</button><span id="close" class="pill" aria-hidden="true">×</span><button id="cardInfo" class="pill" aria-label="查看卡片尾号"><i>123</i></button><span id="searchButton" class="pill" aria-hidden="true"><i></i></span><button id="more" class="pill" aria-label="交易选项">•••</button></header>
<section id="home"><div class="card" role="img" aria-label="Postepay Evolution 卡面，尾号 7823"></div><h2>近期交易</h2><div id="list" class="list"></div></section>
<section id="detail" hidden></section>
</main>
<script>
const transactions=[
["Cisalfa Sport SpA","104,64","10/11/26","","23:54"],
["Apple","102,99","03/11/26","Apple Pay"],
["TikTok","23,39","30/10/26","www.tiktok.com"],
["TikTok","11,70","23/10/26","www.tiktok.com"],
["TikTok","12,87","23/10/26","www.tiktok.com"],
["TikTok","23,39","20/10/26","www.tiktok.com"],
["Apple","22,99","14/10/26"],
["McDonald's","14,70","10/10/26","Apple Pay"],
["Algoapp Flashcards","4,99","24/09/26"],
["Apple","13,55","23/09/26","Apple Pay"]
];
const get=id=>document.getElementById(id);
const home=get("home"),detail=get("detail"),back=get("back"),list=get("list");
let listScroll=0;
function showList(){
  list.innerHTML=transactions.map(([name,amount,date,channel],i)=>{
    return `<button class="row" data-index="${i}"><span><strong>${name}</strong>${channel?`<span class="sub">${channel}</span>`:""}<span class="sub">${i===0?"昨天":date}</span></span><span class="price">€${amount}<span class="arrow">›</span></span></button>`;
  }).join("")||'<p class="note">没有匹配的交易</p>';
}
function render(){
  const match=location.hash.match(/^#transaction-(\d+)$/);
  const transaction=match&&transactions[Number(match[1])-1];
  home.hidden=!!transaction;
  detail.hidden=!transaction;
  back.hidden=!transaction;
  get("close").hidden=!!transaction;
  get("more").hidden=!!transaction;
  get("searchButton").hidden=!!transaction;
  get("cardInfo").hidden=!!transaction;
  if(!transaction){window.scrollTo(0,listScroll);return;}
  const [name,amount,date,channel,time]=transaction;
  detail.innerHTML=`<div class="hero"><h1>€${amount}</h1><span class="sub">${name}</span>${channel?`<span class="sub">${channel}</span>`:""}<span class="sub">${date}${time?" "+time:""}</span></div>
  <div class="box"><strong>状态：${time?"已批准（演示）":"模拟交易"}</strong><span class="sub">Postepay Evolution Mastercard</span><div class="total"><strong>累计</strong><strong>€${amount}</strong></div></div>
  <div class="box section-title">联系 Poste Italiane</div><p class="note">对于无法识别或存在异议的消费，请联系 Poste Italiane 以获得帮助。</p>
  <div class="box section-title">报告不正确的商家信息</div><p class="note">“钱包”使用“地图”提供你交易的商家名称、类别和位置。通过报告不正确的信息来帮助提高准确性。</p>`;
  window.scrollTo(0,0);
}
list.onclick=event=>{
  const row=event.target.closest("[data-index]");
  if(!row)return;
  listScroll=window.scrollY;
  location.hash="transaction-"+(Number(row.dataset.index)+1);
};
back.onclick=()=>{if(history.state?.fromList)history.back();else location.hash="";};
window.addEventListener("hashchange",event=>{
  if(!new URL(event.oldURL).hash&&location.hash)history.replaceState({fromList:true},"");
  render();
});
get("cardInfo").onclick=()=>alert("Postepay Evolution Mastercard · •••• 7823");
get("more").onclick=()=>{list.hidden=false;showList();window.scrollTo(0,0);};

showList();
render();
</script></html>
